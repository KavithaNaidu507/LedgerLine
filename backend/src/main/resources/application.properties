spring.application.name=ledgerline
server.port=8080

# --- Database. DB_PASSWORD has NO default on purpose: you must set it yourself. ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is created by Flyway (db/migration/V1__schema.sql), not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- JWT (override the secret with LEDGERLINE_JWT_SECRET outside local development) ---
ledgerline.jwt.secret=${LEDGERLINE_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
ledgerline.jwt.ttl-minutes=60

# --- Demo users created on first start (LOCAL DEMO ONLY - change the password) ---
ledgerline.seed.admin-email=admin@ledgerline.local
ledgerline.seed.auditor-email=auditor@ledgerline.local
ledgerline.seed.password=${LEDGERLINE_SEED_PASSWORD:ChangeMe123!}

ledgerline.cors.origin=${LEDGERLINE_CORS_ORIGINS:http://localhost:5173}
logging.level.org.hibernate.SQL=warn
